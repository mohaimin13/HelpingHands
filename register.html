
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - HelpingHands</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="register-container">

        <!-- Left Side -->
        <div class="register-left">

            <div class="brand">
                <h1>HelpingHands</h1>
                <p>Together We Rise, Together We Care, Together We Build a Better Tomorrow</p>
            </div>

        </div>


        <!-- Right Side -->
        <div class="register-right">

            <div class="register-box">

                <h2>Create Account</h2>
                <p>Register your account to get started</p>

                <form id="registerForm" novalidate>

                    <!-- Name -->
                    <div class="input-group">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <!-- Email -->
                    <div class="input-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <!-- Password -->
                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                            >
                                Show
                            </button>

                        </div>
                    </div>


                    <!-- Confirm Password -->
                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleConfirmPassword"
                            >
                                Show
                            </button>

                        </div>
                    </div>


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="register-btn"
                    >
                        Create Account
                    </button>

                </form>


                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </div>


    <!-- Custom Message Modal -->
    <div class="message-overlay" id="messageModal">

        <div class="message-box">

            <div class="message-icon" id="messageIcon"></div>

            <h2 id="messageTitle">Message</h2>

            <p id="messageText"></p>

            <div class="message-actions">
                <button type="button" id="messageOkBtn">
                    OK
                </button>
            </div>

        </div>

    </div>


    <script src="register.js"></script>

</body>
</html>
